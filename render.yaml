# Render Infrastructure-as-Code Blueprint
# Deploy PostgreSQL + Django API + React Frontend with one click.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: cds-postgres
    databaseName: cds
    user: cds_user
    plan: free
    postgresMajorVersion: "16"

services:
  # -------------------------------------------------------------
  # Backend Web Service (Django + Gunicorn + Tesseract OCR)
  # -------------------------------------------------------------
  - type: web
    name: clinical-cds-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: cds-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://clinical-cds-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://clinical-cds-frontend.onrender.com
      # AI Provider settings (enter AI_API_KEY on the Render Blueprint setup page)
      - key: AI_PROVIDER
        value: deepseek
      - key: AI_MODEL
        value: deepseek-chat
      - key: AI_API_KEY
        sync: false
      # Optional Medical Web Search (providers tried left to right; enter the keys
      # on the Render Blueprint setup page, see .env.example for how to get them)
      - key: WEB_SEARCH_PROVIDER
        value: google,tavily
      - key: WEB_SEARCH_GOOGLE_API_KEY
        sync: false
      - key: WEB_SEARCH_GOOGLE_ENGINE_ID
        sync: false
      - key: WEB_SEARCH_API_KEY
        sync: false
      - key: WEB_SEARCH_ALLOWED_DOMAINS
        value: who.int,moh.gov.rw,rbc.gov.rw,rfd.gov.rw,cdc.gov,nih.gov,nhs.uk,mayoclinic.org,medlineplus.gov,ncbi.nlm.nih.gov,fda.gov,acr.org,nice.org.uk
      # Authentication
      - key: JWT_ACCESS_MINUTES
        value: "60"
      - key: JWT_REFRESH_DAYS
        value: "7"

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite + TypeScript)
  # -------------------------------------------------------------
  - type: web
    name: clinical-cds-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://clinical-cds-backend.onrender.com/api
